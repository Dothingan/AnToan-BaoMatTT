<!DOCTYPE html>
<html>
<head>
    <title>Caesar Cipher Decryption</title>
</head>
<body>
    <h2>Thám mã dịch vòng</h2>
    <p>Bản mã: vybircuravxnn</p>
    <button onclick="bruteForceCaesar()">Thực hiện thám mã</button>
    <div id="output"></div>

    <script>
        function decryptCaesarCipher(ciphertext, shift) {
            let result = '';
            for (let i = 0; i < ciphertext.length; i++) {
                let char = ciphertext.charCodeAt(i);
                if (char >= 97 && char <= 122) { // ký tự thường (a-z)
                    result += String.fromCharCode(((char - 97 - shift + 26) % 26) + 97);
                } else {
                    result += ciphertext[i];
                }
            }
            return result;
        }

        function bruteForceCaesar() {
            const ciphertext = 'vybircuravxnn';
            let output = '';
            for (let shift = 1; shift <= 25; shift++) {
                const decrypted = decryptCaesarCipher(ciphertext, shift);
                output += `Khóa: ${shift} -> Bản rõ: ${decrypted}<br>`;
            }
            document.getElementById("output").innerHTML = output;
        }
    </script>
</body>
</html>
