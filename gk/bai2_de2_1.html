<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 & DES Encryption</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>MD5 Hash & DES Encryption</h2>

        <label for="fileInput">Choose a file:</label>
        <input type="file" id="fileInput">

        <label for="desKey">DES Encryption Key:</label>
        <input type="text" id="desKey" placeholder="Enter DES key (8 characters)">

        <label for="checksumInput">Enter MD5 Checksum:</label>
        <input type="text" id="checksumInput" placeholder="Enter expected MD5 checksum">

        <button id="processBtn">Process File</button>

        <div class="result">
            <h4>Result</h4>
            <pre id="resultText"></pre>
        </div>
    </div>

    <script>
        document.getElementById('processBtn').addEventListener('click', function () {
            const fileInput = document.getElementById('fileInput');
            const desKey = document.getElementById('desKey').value;
            const expectedChecksum = document.getElementById('checksumInput').value;
            const resultText = document.getElementById('resultText');

            if (fileInput.files.length === 0) {
                alert("Vui lòng chọn file.");
                return;
            }

            if (desKey.length !== 8) {
                alert("Khóa DES phải có độ dài 8 ký tự.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                const fileContent = e.target.result;

                // Step 1: Hash the file content using MD5
                const hashValue = CryptoJS.MD5(fileContent).toString();
                console.log("MD5 Hash:", hashValue);

                // Step 2: Check if the hash matches the expected checksum
                const integrityCheck = hashValue === expectedChecksum;

                // Step 3: Append the hash value to the file content
                const contentWithHash = fileContent + hashValue;

                // Step 4: Encrypt the combined content (file + hash) using DES
                const encrypted = CryptoJS.DES.encrypt(contentWithHash, desKey).toString();
                console.log("Encrypted (DES):", encrypted);

                // Output result
                resultText.textContent = `MD5 Hash: ${hashValue}\nEncrypted Content (DES): ${encrypted}`;

                if (integrityCheck) {
                    resultText.textContent += `\n\nFile is intact (checksum matches).`;
                } else {
                    resultText.textContent += `\n\nFile is corrupted (checksum does not match).`;
                }

                // Step 5: Save encrypted content to rsa-encrypt.dat file
                saveToFile(encrypted, 'rsa-encrypt.dat');
            };

            reader.readAsText(file);
        });

        // Function to save result to a file
        function saveToFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
    </script>
</body>
</html>
